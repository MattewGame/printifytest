<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ПринтХаб — печать по требованию для маркетплейсов</title>
<style>
:root{
  --bg:#f4f5f9; --panel:#fff; --line:#e6e8f0; --text:#0f172a; --muted:#6b7280;
  --accent:#6366f1; --accent-soft:#eef0ff; --wb:#cb11ab; --ozon:#005bff;
  --ym:#fc3f1d; --vk:#0077ff; --ok:#10b981; --warn:#f59e0b; --danger:#ef4444;
  --r:14px; --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:248px;flex:0 0 248px;background:var(--panel);border-right:1px solid var(--line);
  padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;
}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo-mark{
  width:34px;height:34px;border-radius:10px;flex:0 0 34px;
  background:linear-gradient(135deg,#6366f1,#a855f7);display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:16px;box-shadow:0 4px 12px rgba(99,102,241,.35)
}
.logo-text b{display:block;font-size:15px;letter-spacing:-.2px}
.logo-text span{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.3px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:#9ca3af;padding:10px 10px 4px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9.5px 11px;border-radius:10px;
  color:#475569;font-weight:500;transition:.15s;width:100%;text-align:left;position:relative;
}
.nav-item:hover{background:#f5f6fa;color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item.active::before{
  content:'';position:absolute;left:-14px;top:50%;transform:translateY(-50%);
  width:3px;height:20px;background:var(--accent);border-radius:0 3px 3px 0;
}
.nav-item svg{flex:0 0 18px}
.nav-badge{
  margin-left:auto;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;
  padding:2px 7px;border-radius:20px;line-height:1.5
}
.sidebar-foot{margin-top:auto;background:#f8f9fc;border:1px solid var(--line);border-radius:12px;padding:12px}
.sidebar-foot .t{font-size:11.5px;color:var(--muted);margin-bottom:3px}
.sidebar-foot .v{font-size:17px;font-weight:700;letter-spacing:-.3px}
.sidebar-foot .b{margin-top:9px;font-size:11.5px;color:var(--accent);font-weight:600}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:64px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;
  padding:0 26px;position:sticky;top:0;z-index:20
}
.topbar h1{font-size:17px;font-weight:700;letter-spacing:-.3px}
.topbar .sub{font-size:12px;color:var(--muted);margin-top:1px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.demo-tag{
  font-size:11px;font-weight:700;color:var(--warn);background:#fff7ed;
  border:1px solid #fed7aa;padding:4px 9px;border-radius:20px
}
.avatar{
  width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ef4444);
  color:#fff;display:grid;place-items:center;font-weight:700;font-size:12.5px
}
.view{padding:24px 26px 60px;flex:1}

/* ---------- Atoms ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-head h3{font-size:14.5px;font-weight:650}
.card-head .hint{font-size:12px;color:var(--muted)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:10px;font-weight:600;font-size:13px;transition:.15s;
  border:1px solid transparent;white-space:nowrap
}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.28)}
.btn-primary:hover{background:#4f46e5}
.btn-ghost{background:#fff;border-color:var(--line);color:#334155}
.btn-ghost:hover{background:#f8f9fc;border-color:#cbd5e1}
.btn-sm{padding:6.5px 11px;font-size:12.5px;border-radius:9px}
.btn-block{width:100%}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:3.5px 9px;border-radius:20px}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.new{color:#2563eb;background:#eff6ff}
.pill.production{color:#b45309;background:#fffbeb}
.pill.ready{color:#7c3aed;background:#f5f3ff}
.pill.shipped{color:#047857;background:#ecfdf5}

.mp{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700}
.mp i{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-style:normal;font-size:10px;color:#fff;font-weight:800}
.mp-wb i{background:var(--wb)} .mp-ozon i{background:var(--ozon)}
.mp-ym i{background:var(--ym)} .mp-vk i{background:var(--vk)}

/* ---------- Dashboard ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.stat{padding:17px 18px;position:relative;overflow:hidden}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:500;margin-bottom:7px}
.stat .val{font-size:25px;font-weight:750;letter-spacing:-.8px;line-height:1}
.stat .delta{font-size:11.5px;font-weight:650;margin-top:7px;display:inline-flex;gap:4px;align-items:center}
.up{color:#059669} .down{color:var(--danger)}
.stat .ico{position:absolute;right:15px;top:15px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}

.grid-2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
@media(max-width:1100px){.grid-2{grid-template-columns:1fr}}

.chart{display:flex;align-items:flex-end;gap:12px;height:180px;padding:8px 4px 0}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bar{
  width:100%;max-width:44px;border-radius:8px 8px 4px 4px;
  background:linear-gradient(180deg,#818cf8,#6366f1);transition:.25s;position:relative;min-height:6px
}
.bar:hover{background:linear-gradient(180deg,#6366f1,#4f46e5)}
.bar-wrap span{font-size:11.5px;color:var(--muted);font-weight:500}

table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
  color:#9ca3af;font-weight:650;padding:11px 20px;border-bottom:1px solid var(--line)
}
td{padding:13px 20px;border-bottom:1px solid #f1f2f7;font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafbfd}
.t-main{font-weight:600}
.t-sub{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ---------- Catalog ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{
  padding:7px 14px;border-radius:20px;background:#fff;border:1px solid var(--line);
  font-size:13px;font-weight:550;color:#475569;transition:.15s
}
.chip:hover{border-color:#c7cbd8}
.chip.active{background:var(--text);color:#fff;border-color:var(--text)}

.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:16px}
.prod{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);transition:.18s;cursor:pointer}
.prod:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(16,24,40,.10);border-color:#d7dae6}
.prod-img{aspect-ratio:1/1;background:linear-gradient(160deg,#f8f9fd,#eef0f7);display:grid;place-items:center;padding:22px}
.prod-img svg{width:100%;height:100%}
.prod-body{padding:14px 16px 16px}
.prod-body h4{font-size:13.5px;font-weight:650;margin-bottom:9px}
.prod-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:11px}
.prod-meta b{color:var(--text);font-weight:700}
.colors{display:flex;gap:5px;margin-bottom:12px}
.dot{width:15px;height:15px;border-radius:50%;border:1.5px solid rgba(0,0,0,.12);cursor:pointer;transition:.15s}
.dot:hover{transform:scale(1.15)}
.dot.active{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}

/* ---------- Designer ---------- */
.designer{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
@media(max-width:1000px){.designer{grid-template-columns:1fr}}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px;min-height:520px;
  background:
    radial-gradient(circle at 1px 1px, #d9dcea 1px, transparent 0) 0 0/22px 22px,
    linear-gradient(180deg,#fbfbfe,#f1f2f8);
}
.canvas{position:relative;width:100%;max-width:400px;aspect-ratio:1/1;touch-action:none;user-select:none}
.canvas svg.base{width:100%;height:100%;display:block;filter:drop-shadow(0 12px 26px rgba(16,24,40,.13))}
.print-area{
  position:absolute;border:2px dashed rgba(99,102,241,.55);border-radius:6px;
  pointer-events:none;background:rgba(99,102,241,.045)
}
.print-area::after{
  content:'Зона печати';position:absolute;top:-19px;left:0;font-size:10px;
  color:#818cf8;font-weight:650;letter-spacing:.3px
}
.design-layer{
  position:absolute;cursor:grab;transform-origin:center;touch-action:none;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.18))
}
.design-layer:active{cursor:grabbing}
.design-layer img{width:100%;display:block;pointer-events:none}
.design-empty{
  width:100%;aspect-ratio:1/1;border:2px dashed rgba(99,102,241,.6);border-radius:8px;
  display:grid;place-items:center;color:#818cf8;font-size:11.5px;font-weight:650;
  background:rgba(99,102,241,.07);text-align:center;padding:10px;line-height:1.4
}
.ctrl{margin-bottom:18px}
.ctrl label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:8px}
.ctrl label span{color:var(--muted);font-weight:600}
input[type=range]{
  -webkit-appearance:none;width:100%;height:5px;border-radius:5px;
  background:linear-gradient(90deg,var(--accent) 0%,var(--accent) var(--p,50%),#e2e5ef var(--p,50%),#e2e5ef 100%);
  outline:none
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:#fff;
  border:3px solid var(--accent);cursor:pointer;box-shadow:0 2px 6px rgba(99,102,241,.35)
}
.color-row{display:flex;gap:8px;flex-wrap:wrap}
.color-row .dot{width:26px;height:26px;border-radius:9px}
.upload{
  border:1.5px dashed #cbd5e1;border-radius:12px;padding:20px;text-align:center;
  background:#fafbfd;transition:.15s;cursor:pointer;display:block
}
.upload:hover{border-color:var(--accent);background:var(--accent-soft)}
.upload .ic{font-size:20px;margin-bottom:6px}
.upload b{display:block;font-size:13px;font-weight:650;margin-bottom:3px}
.upload span{font-size:11.5px;color:var(--muted)}
.calc{background:#f8f9fc;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
.calc-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0}
.calc-row.total{border-top:1px dashed #d7dae6;margin-top:7px;padding-top:11px;font-weight:750;font-size:15px}
.calc-row.total span:last-child{color:#059669}
.stepper{display:flex;gap:6px}
.stepper button{
  width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;
  font-weight:700;color:#475569;display:grid;place-items:center
}
.stepper button:hover{background:#f5f6fa}

/* ---------- Marketplaces ---------- */
.mp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.mp-card{padding:20px;display:flex;flex-direction:column;gap:14px}
.mp-top{display:flex;align-items:center;gap:12px}
.mp-logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px}
.mp-top h3{font-size:15px;font-weight:700}
.mp-top p{font-size:11.5px;color:var(--muted);margin-top:2px}
.mp-stats{display:flex;gap:20px;padding:13px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.mp-stats div{flex:1}
.mp-stats .k{font-size:11px;color:var(--muted);margin-bottom:3px}
.mp-stats .v{font-size:15px;font-weight:700}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.on{background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.18)}
.off{background:#cbd5e1}

/* ---------- Modal & Toast ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(3px);
  display:grid;place-items:center;z-index:100;padding:20px;animation:fade .18s ease
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:18px;width:100%;max-width:430px;padding:26px;
  box-shadow:0 24px 60px rgba(15,23,42,.28);animation:pop .2s cubic-bezier(.2,.9,.3,1.3)
}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{font-size:17px;font-weight:700;margin-bottom:5px}
.modal p.m-sub{font-size:12.5px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.field input{
  width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:10px;
  background:#fafbfd;outline:none;transition:.15s;font-size:13px
}
.field input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.modal-actions{display:flex;gap:10px;margin-top:22px}
.modal-actions .btn{flex:1}

#toasts{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:10px;z-index:200}
.toast{
  background:#0f172a;color:#fff;padding:13px 18px;border-radius:12px;font-size:13px;font-weight:550;
  box-shadow:0 12px 32px rgba(15,23,42,.35);display:flex;align-items:center;gap:10px;
  animation:slideIn .25s cubic-bezier(.2,.9,.3,1.2);max-width:340px
}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
.toast .tick{
  width:20px;height:20px;border-radius:50%;background:#10b981;display:grid;place-items:center;
  font-size:12px;flex:0 0 20px
}

.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:10px}

/* ---------- Responsive ---------- */
@media(max-width:860px){
  .app{flex-direction:column}
  .sidebar{
    width:100%;flex:none;height:auto;position:static;flex-direction:row;align-items:center;
    padding:10px 12px;gap:12px;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line)
  }
  .logo-text,.sidebar-foot,.nav-label{display:none}
  .nav{flex-direction:row;gap:4px}
  .nav-item span{display:none}
  .nav-item{padding:10px}
  .nav-item.active::before{display:none}
  .view{padding:18px 16px 50px}
  .topbar{padding:0 16px}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark">П</div>
      <div class="logo-text"><b>ПринтХаб</b><span>POD-ПЛАТФОРМА</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="t">Баланс кабинета</div>
      <div class="v">48 320 ₽</div>
      <div class="b">Пополнить →</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Дашборд</h1>
        <div class="sub" id="pageSub">Обзор продаж и производства</div>
      </div>
      <div class="topbar-right">
        <span class="demo-tag">ПРОТОТИП · DEMO</span>
        <div class="avatar">ИП</div>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div id="toasts"></div>

<script>
/* =========================================================

const S = (p) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

  markets:   S('<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>'),

};

/* =========================================================
   ДАННЫЕ (моки)
   ========================================================= */
const PRODUCTS = [
  { id:1, type:'tee',     name:'Футболка Oversize',    cost:690,  retail:1890, print:'A3 · DTF',
    colors:['#0f172a','#ffffff','#ef4444','#3b82f6','#22c55e','#a855f7'],
    area:{l:33,t:24,w:34,h:38} },
  { id:2, type:'hoodie',  name:'Худи с капюшоном',     cost:1490, retail:3690, print:'A3 · DTF',
    colors:['#0f172a','#ffffff','#6b7280','#dc2626','#1e40af'],
    area:{l:32,t:30,w:36,h:34} },
  { id:3, type:'sweat',   name:'Свитшот унисекс',      cost:1190, retail:2990, print:'A3 · DTF',
    colors:['#0f172a','#ffffff','#f59e0b','#14b8a6','#7c3aed'],
    area:{l:33,t:26,w:34,h:36} },
  { id:4, type:'mug',     name:'Кружка керамическая',  cost:250,  retail:790,  print:'A4 · Сублимация',
    colors:['#ffffff','#0f172a','#ef4444','#3b82f6'],

/* =========================================================
   SVG-ГЕНЕРАТОРЫ МАКЕТОВ ТОВАРОВ
   ========================================================= */
function productSVG(type, color){
  const st = 'rgba(0,0,0,.22)';
  const sh = 'rgba(0,0,0,.07)';
  const common = `stroke="${st}" stroke-width="2" stroke-linejoin="round"`;

  switch(type){
    case 'tee': return `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 34 L126 20 Q150 42 174 20 L200 34 L246 64 L228 112 L204 102 L204 274 L96 274 L96 102 L72 112 L54 64 Z" fill="${color}" ${common}/>
      <path d="M126 20 Q150 48 174 20" fill="none" stroke="${st}" stroke-width="2"/>
      <path d="M96 102 L72 112 L54 64 L78 52 Z" fill="${sh}"/>
      <path d="M204 102 L228 112 L246 64 L222 52 Z" fill="${sh}"/>
    </svg>`;

    case 'hoodie': return `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
      <path d="M100 60 L122 34 Q150 74 178 34 L200 60 L252 94 L234 148 L206 134 L206 284 L94 284 L94 134 L66 148 L48 94 Z" fill="${color}" ${common}/>
      <path d="M122 34 Q150 78 178 34" fill="none" stroke="${st}" stroke-width="2"/>
      <path d="M130 34 Q150 62 170 34" fill="${sh}" stroke="none"/>
      <line x1="150" y1="70" x2="150" y2="128" stroke="rgba(0,0,0,.18)" stroke-width="2.5"/>
      <path d="M116 196 h68 v54 h-68 z" fill="${sh}" rx="4"/>
      <path d="M94 134 L66 148 L48 94 L76 82 Z" fill="${sh}"/>
      <path d="M206 134 L234 148 L252 94 L224 82 Z" fill="${sh}"/>
    </svg>`;

    case 'sweat': return `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
      <path d="M98 40 L128 22 Q150 46 172 22 L202 40 L252 78 L232 132 L206 118 L206 280 L94 280 L94 118 L68 132 L48 78 Z" fill="${color}" ${common}/>
      <path d="M128 22 Q150 52 172 22" fill="none" stroke="${st}" stroke-width="2"/>
      <rect x="94" y="252" width="112" height="28" fill="${sh}"/>
      <path d="M94 118 L68 132 L48 78 L74 66 Z" fill="${sh}"/>
      <path d="M206 118 L232 132 L252 78 L226 66 Z" fill="${sh}"/>
    </svg>`;

    case 'mug': return `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
      <path d="M196 118 h22 a34 34 0 0 1 0 68 h-22" fill="none" stroke="${color}" stroke-width="20" stroke-linecap="round"/>
      <path d="M196 118 h22 a34 34 0 0 1 0 68 h-22" fill="none" stroke="${st}" stroke-width="2"/>
      <path d="M74 88 h128 v138 a22 22 0 0 1 -22 22 h-84 a22 22 0 0 1 -22 -22 z" fill="${color}" ${common}/>
      <ellipse cx="138" cy="88" rx="64" ry="13" fill="${sh}" stroke="${st}" stroke-width="2"/>
      <path d="M74 88 v138 a22 22 0 0 0 22 22 h14 V88 z" fill="${sh}"/>
    </svg>`;

    case 'bag': return `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
      <path d="M112 118 v-30 a38 38 0 0 1 76 0 v30" fill="none" stroke="${st}" stroke-width="15" stroke-linecap="round"/>
      <path d="M112 118 v-30 a38 38 0 0 1 76 0 v30" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"/>
      <path d="M72 112 L228 112 L242 274 L58 274 Z" fill="${color}" ${common}/>
      <path d="M72 112 L100 112 L92 274 L58 274 Z" fill="${sh}"/>
    </svg>`;

    case 'cap': return `<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
      <path d="M64 172 a86 86 0 0 1 172 0 z" fill="${color}" ${common}/>
      <path d="M64 172 h172 q6 40 -86 40 t-86 -40 z" fill="${color}" ${common}/>
      <path d="M64 172 h172 q4 26 -60 35 L128 172 z" fill="${sh}"/>
      <path d="M150 86 v86" stroke="rgba(0,0,0,.15)" stroke-width="2" fill="none"/>
      <path d="M108 96 q10 40 8 76" stroke="rgba(0,0,0,.15)" stroke-width="2" fill="none"/>
      <path d="M192 96 q-10 40 -8 76" stroke="rgba(0,0,0,.15)" stroke-width="2" fill="none"/>
      <circle cx="150" cy="88" r="5" fill="${sh}" stroke="${st}" stroke-width="1.5"/>
    </svg>`;
  }
  return '';
}

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const money = n => n.toLocaleString('ru-RU') + ' ₽';
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="tick">✓</span><span>${msg}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => {
    el.style.transition = '.25s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(30px)';
    setTimeout(() => el.remove(), 250);
  }, 2600);
}

function renderNav(){
  $('#nav').innerHTML = `<div class="nav-label">Работа</div>` + PAGES.map(p => `
    <button class="nav-item ${state.page === p.id ? 'active' : ''}" data-page="${p.id}">

function go(page){
  state.page = page;
  const meta = PAGES.find(p => p.id === page);
  $('#pageTitle').textContent = meta.title;
  $('#pageSub').textContent = meta.sub;
  renderNav();
  render();

}

}

}

/* =========================================================
   ОБРАБОТЧИКИ
   ========================================================= */
function bind(){
  // Навигация
  $$('[data-page]').forEach(b => b.onclick = () => go(b.dataset.page));

  // Дашборд → переход к маркетплейсам
  $$('[data-goto-market]').forEach(b => b.onclick = () => go('markets'));

  // Фильтр каталога
  $$('[data-filter]').forEach(b => b.onclick = () => {
    state.catalogFilter = b.dataset.filter;
    render();
  });

  // Карточка товара → дизайнер
  $$('[data-design]').forEach(el => el.onclick = () => {
    const id = +el.dataset.design;
    state.design.productId = id;
    state.design.color = getProduct(id).colors[0];
    state.design.image = null;
    state.design.size = 38;
    state.design.x = 50;
    state.design.y = 43;
    state.design.rot = 0;
    go('designer');
  });

  // Цвета в каталоге (превью)
  $$('.prod .dot').forEach(d => d.onclick = e => {
    e.stopPropagation();
    const card = d.closest('.prod');
    card.querySelectorAll('.dot').forEach(x => x.classList.remove('active'));
    d.classList.add('active');
    card.querySelector('.prod-img').innerHTML = productSVG(+card.dataset.design, d.dataset.color || d.style.background);
  });

  // Фильтр заказов
  $$('[data-ofilter]').forEach(b => b.onclick = () => {
    state.orderFilter = b.dataset.ofilter;
    render();
  });

  // Действия с заказами
  $$('[data-print]').forEach(b => b.onclick = () => toast(`Заказ ${b.dataset.print} отправлен в производство`));
  $$('[data-more]').forEach(b => b.onclick = () => toast(`Детали заказа ${b.dataset.more} — в разработке`));

  // Маркетплейсы
  $$('[data-connect]').forEach(b => b.onclick = () => openConnectModal(b.dataset.connect));
  $$('[data-disconnect]').forEach(b => b.onclick = () => {
    const m = state.marketplaces.find(x => x.id === b.dataset.disconnect);
    m.connected = false; m.orders = 0; m.revenue = 0;
    render(); toast(`${m.name} отключён`);
  });
  $$('[data-sync]').forEach(b => b.onclick = () => {
    const m = state.marketplaces.find(x => x.id === b.dataset.sync);
    b.textContent = 'Синхронизация…';
    setTimeout(() => toast(`${m.name}: синхронизировано 24 товара, 3 заказа`), 900);
  });

  // ---------- ДИЗАЙНЕР ----------
  const sel = $('#selProduct');
  if (sel) sel.onchange = () => {
    const id = +sel.value;
    state.design.productId = id;
    state.design.color = getProduct(id).colors[0];
    render();
  };

  $$('#colorRow .dot').forEach(d => d.onclick = () => {
    state.design.color = d.dataset.color;
    render();
  });

  const file = $('#fileInput');
  if (file) file.onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    if (f.size > 10 * 1024 * 1024) return toast('Файл больше 10 МБ');
    const r = new FileReader();
    r.onload = ev => { state.design.image = ev.target.result; render(); toast('Макет загружен'); };
    r.readAsDataURL(f);
  };

  const clearImg = $('#clearImg');
  if (clearImg) clearImg.onclick = () => { state.design.image = null; render(); };

  bindRange('#rSize', 'size', v => `${v}%`, 'vSize');
  bindRange('#rRot',  'rot',  v => `${v}°`, 'vRot');
  bindRange('#rY',    'y',    v => `${Math.round(v)}%`, 'vY');

  const canvas = $('#canvas');
  if (canvas) initDrag(canvas);

  $$('[data-pub]').forEach(b => b.onclick = () => {
    const m = state.marketplaces.find(x => x.id === b.dataset.pub);
    publish(m);
  });
  const pub = $('#publishBtn');
  if (pub) pub.onclick = () => {
    const connected = state.marketplaces.filter(m => m.connected);
    if (!connected.length) return toast('Сначала подключите маркетплейс');
    connected.forEach(publish);
  };
}

/* Слайдеры дизайнера */
function bindRange(sel, key, fmt, labelId){
  const el = $(sel);
  if (!el) return;
  const paint = () => {
    const p = (el.value - el.min) / (el.max - el.min) * 100;
    el.style.setProperty('--p', p + '%');
  };
  paint();
  el.oninput = () => {
    const v = parseFloat(el.value);
    state.design[key] = v;
    paint();
    const lbl = $('#' + labelId);
    if (lbl) lbl.textContent = fmt(v);
    updateLayer();
  };
}

function updateLayer(){
  const d = state.design;
  const layer = $('#layer');
  if (!layer) return;
  layer.style.left = d.x + '%';
  layer.style.top = d.y + '%';
  layer.style.width = d.size + '%';
  layer.style.transform = `translate(-50%,-50%) rotate(${d.rot}deg)`;
}

/* Drag & drop макета */
function initDrag(canvas){
  const layer = $('#layer');
  if (!layer) return;
  let start = null;

  layer.addEventListener('pointerdown', e => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    start = { mx: e.clientX, my: e.clientY, x: state.design.x, y: state.design.y, w: r.width, h: r.height };
    layer.setPointerCapture(e.pointerId);
    layer.style.cursor = 'grabbing';
  });

  layer.addEventListener('pointermove', e => {
    if (!start) return;
    const dx = (e.clientX - start.mx) / start.w * 100;
    const dy = (e.clientY - start.my) / start.h * 100;
    state.design.x = clamp(start.x + dx, 5, 95);
    state.design.y = clamp(start.y + dy, 8, 92);
    updateLayer();
    const rY = $('#rY');
    if (rY) { rY.value = state.design.y; const l = $('#vY'); if (l) l.textContent = Math.round(state.design.y) + '%'; }
  });

  const stop = e => {
    if (!start) return;
    start = null;
    layer.style.cursor = 'grab';
  };
  layer.addEventListener('pointerup', stop);
  layer.addEventListener('pointercancel', stop);
}

/* Публикация товара */
function publish(m){
  const p = getProduct(state.design.productId);
  state.myProducts.push({ ...p, mp: m.id });
  toast(`«${p.name}» опубликован на ${m.name}`);
}

/* =========================================================
   МОДАЛКА ПОДКЛЮЧЕНИЯ
   ========================================================= */
function openConnectModal(id){
  const m = state.marketplaces.find(x => x.id === id);
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Подключение ${m.name}</h3>
      <p class="m-sub">
        Введите ключи из личного кабинета продавца. Данные хранятся в зашифрованном виде
        и используются только для работы с API ${m.name}.
      </p>
      <div class="field">
        <label>${id === 'ozon' ? 'Client-Id' : 'Идентификатор продавца'}</label>
        <input id="fClient" placeholder="${id === 'ozon' ? '123456' : 'seller_000123'}" value="${id === 'ozon' ? '123456' : 'seller_000123'}">
      </div>
      <div class="field">
        <label>API-ключ</label>
        <input id="fKey" type="password" placeholder="••••••••••••••••" value="demo-key-0000000000">
      </div>
      <div class="field">
        <label>Схема работы</label>
        <select id="fScheme" style="width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:#fafbfd;outline:none">
          <option>FBS — продажа со склада производства</option>
          <option>FBO — продажа со склада маркетплейса</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="mCancel">Отмена</button>
        <button class="btn btn-primary" id="mOk">Подключить</button>
      </div>
    </div>`;

  document.body.appendChild(overlay);

  const close = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) close(); };
  $('#mCancel', overlay).onclick = close;
  $('#mOk', overlay).onclick = () => {
    const key = $('#fKey', overlay).value.trim();
    if (!key) return toast('Введите API-ключ');
    m.connected = true;
    m.orders = Math.floor(Math.random() * 40) + 8;
    m.revenue = m.orders * (1400 + Math.floor(Math.random() * 900));
    close();
    render();
    toast(`${m.name} успешно подключён`);
  };
}

   СТАРТ

render();
